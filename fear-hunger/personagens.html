  <link rel="stylesheet" href="style.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .container {
      background: url("https://static.tumblr.com/c2a89316cf61698d23a91eddbdcdd07a/fm0gele/Opiopxpqp/tumblr_static_apuknpsn5i0cko0o4c4skkg4g.png")
        no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .footer {
      margin-top: auto;
    }

    h3, p {
      color: #fff;
    }

    p {
      font-size: 20px;
    }

    .spacer-box {
      height: 60px;
      width: 100%;
      background: transparent;
    }

    .barra-lateral {
      background-color: rgba(0, 0, 0, 0.801);
      height: 100%;
      width: 180px;
      position: fixed;
      z-index: 1;
    }

    .barra-lateral a {
      text-decoration: none;
      color: white;
      font-size: 25px;
      padding: 6px 10px 6px 18px;
      display: block;
      padding-top: 60px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: relative;
      margin: 10px auto;
      width: 900px;
      max-width: 95%;
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      border: 2px solid red;
      border-radius: 8px;
      z-index: 10;
      padding: 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-content img {
      max-width: 180px;
      width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
      border-radius: 5px;
    }

    .modal-content h2 {
      text-align: center;
      margin: 0 0 10px 0;
    }

    .modal-content p {
      font-size: 18px;
      line-height: 1.4;
      text-align: center;
    }

    .close {
      color: white;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .close:hover {
      color: red;
    }

    .extra-boxes {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    .box-historia,
    .box-status,
    .box-personalidade {
      background-color: rgba(255, 255, 255, 0.05);
      border: 2px solid red;
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
    }

    .box-historia, .box-personalidade {
      width: 55%;
    }

    .box-status {
      width: 35%;
    }

    .box-historia h3,
    .box-status h3,
    .box-personalidade h3 {
      text-align: center;
      color: red;
    }

    .box-historia p,
    .box-personalidade p {
      color: white;
      text-align: justify;
      font-size: 16px;
    }

    .box-status ul {
      list-style: none;
      padding: 0;
    }

    .box-status li {
      color: white;
      font-size: 16px;
      padding: 4px 0;
    }
  </style>
</head>
<body>

        <line x1="0" y1="0" x2="0" y2="180" stroke="red" stroke-width="2" />

        <text x="275" y="75" fill="white" font-size="22" text-anchor="middle" font-family="Arial" dominant-baseline="middle">

    <aside class="barra-lateral">
      <a data-name="Cahara" 
         data-image="https://static.wikia.nocookie.net/fearandhunger/images/1/1f/TheMercenary.png"
         data-desc="Ele é originário dos Santuários Orientais. Uma criança bastarda abandonada à própria sorte ainda muito jovem. De alguma forma, essa pobre alma encontrou o caminho para estas masmorras..." 
         data-historia="Cahara é um homem que escolheu a vida de mercenário para sobreviver. Fugindo de um passado conturbado, ele busca riquezas e redenção nas profundezas da Fortaleza da Fome." 
         data-status="Ataque: 30, Defesa: 16, Sorte: 32, Agilidade: 10"
         data-personalidade="Entre os personagens jogáveis, Cahara parece o mais normal, sem fortes conexões com as Masmorras do Medo e da Fome ou seus poderes sobrenaturais. Ele é simplesmente um mercenário contratado para localizar alguém, alheio ao plano maior que se desenrola ao seu redor. Devido à sua criação, Cahara é um homem implacável e oportunista, mais do que disposto a usar truques baratos para sobreviver e obter vantagem. Como um verdadeiro ladrão de coração, Cahara é consumido pela ganância e uma obsessão implacável por tesouros. Ao chegar à antiga cidade de Ma'habre , seu impulso imediato é saquear suas riquezas. Apesar disso, Cahara parece ter um lado carinhoso, já que seu principal motivo para aceitar a missão é o alto pagamento que o ajudaria a tirar Celeste de sua situação, bem como sustentar seu filho. Ele também expressa desdém pelo plano de Le'garde caso Le'garde se sente no trono dourado, dizendo que o derramamento de sangue necessário para que funcione não vale o resultado final.">Cahara</a>

      <a data-name="Dar'ce" 
         data-image="https://static.wikia.nocookie.net/fearandhunger/images/b/b7/TheKnight.png"
         data-desc="A confiável cavaleira do profetizado. Ela parece terrivelmente fraca diante do brilho ofuscante do único... Mas talvez seja errado subestimar seu potencial..." 
         data-historia="Dar'ce é uma cavaleira que segue o código de honra até as últimas consequências. Sua busca pela verdade a leva às entranhas do desconhecido." 
         data-status="Ataque: 30, Defesa: 16, Sorte: 32, Agilidade: 10"
         data-personalidade="O amor de D'arce por Le'garde é profundo, e ela acredita firmemente na conexão dele com as profecias. Sua devoção inabalável ao capitão é evidente em sua investida destemida nas Masmorras do Medo e da Fome para salvá-lo. Ela está até mesmo disposta a assumir a tarefa de alcançar seu objetivo final de unificar as terras em guerra, caso o encontre morto nas masmorras.

D'arce demonstra uma visão um tanto contraditória da vida, já que o acúmulo injusto de riqueza e poder entre os privilegiados de Rondon foi um dos motivos para ela romper com o reino e se tornar mercenária. Mas essa decisão nem sempre se traduz em empatia pelos plebeus. Ela pode ser distante e menosprezar os outros, rotulando-os como plebeus inferiores.

Sua personalidade conflitante também é evidente em seu comportamento manso e hesitante durante a maior parte de seu tempo nas Masmorras do Medo e da Fome, apesar de possuir uma alma de Dominação . No entanto, se ela enfrentar a traição de Le'garde, ela revelará os traços de seu tipo de alma ao abraçar a escuridão e escolher sobreviver, nunca mais desejando ser uma donzela em perigo. Essa tendência a afirmar a dominância torna-se ainda mais pronunciada se ela ascender como uma nova deusa. Em seus momentos introspectivos, ela reconhece que sua submissão persistiu por tempo suficiente. No fundo, ela anseia por poder sobre os outros, demonstrando seu forte alinhamento com a alma de Dominação .">Dar'ce</a>

      <a data-name="Enki" 
         data-image="https://fearandhunger.wiki.gg/images/thumb/4/41/Enki_portrait.png/180px-Enki_portrait.png"
         data-desc="Um dos sacerdotes sombrios mais notórios da era moderna. Não ficaríamos surpresos se ele se erguesse e se tornasse o novo iluminado." 
         data-historia="Enki é um estudioso das artes ocultas. Ele entra na Fortaleza buscando entender os segredos proibidos que lá residem." 
         data-status="Ataque: 30, Defesa: 16, Sorte: 32, Agilidade: 10"
         data-personalidade="Como alguém nascido com a alma iluminada , Enki é um estudioso de coração, apaixonado por livros e ocultismo. Além de seu desejo por conhecimento, Enki também é definido por suas tendências antissociais, sendo o mais rude e fechado entre os personagens jogáveis. Ele é muito confiante e orgulhoso de sua habilidade com magia e intelecto, o que, combinado com seu comportamento rude, o faz frequentemente parecer arrogante ou condescendente.

Devido ao seu orgulho, ele frequentemente ignora as preocupações dos outros e chega a interpretá-las erroneamente como insultos. Ele também tende a manter seus relacionamentos em um nível profissional e nunca demonstra gratidão ou carinho pelo jogador, sempre encarando o relacionamento deles como nada mais do que um acordo temporário formado por necessidade.

Ele também é descrito como alguém que não se importa com coisas como moralidade e ética, estando mais do que disposto a pagar o preço sombrio necessário para ter sucesso na magia.">Enki</a>

      <a data-name="Ragnvaldr" 
         data-image="https://static.wikia.nocookie.net/fearandhunger/images/c/cd/TheOutlander.png"
         data-desc="Uma figura intimidadora, com certeza. Parece que até um bruto do norte como ele consegue apreciar sutileza e conhecimento." 
         data-historia="Ragnvaldr é um guerreiro das terras selvagens que busca testar sua força contra os horrores da Fortaleza." 
         data-status="Ataque: 40, Defesa: 16, Sorte: 32, Agilidade: 10"
         data-personalidade="Ragnvaldr é um homem definido por sua vontade férrea, uma vontade que lhe permitiu lutar e sobreviver, independentemente das dificuldades que a vida lhe apresentasse. Devido à sua criação nas terras frias do Norte da Europa , Ragnvaldr cresceu e se tornou um homem poderoso, altamente habilidoso na arte da sobrevivência. Suas experiências no continente sombrio de Vinlândia o levariam a desenvolver um profundo ódio e trauma em relação ao sobrenatural, uma cicatriz em seu ser que só aumentaria com a morte de sua família nas mãos de um grupo de mercenários, que desejava um artefato que Ragnvaldr e seus companheiros haviam trazido de Vinlândia.

Em seu final S , depois de vivenciar os horrores da masmorra, Ragnvaldr faria um voto de exterminar todos os monstros repugnantes que assolavam o mundo ocidental, uma tarefa que ele provavelmente assumiu como consequência de suas experiências de vida anteriores com o sobrenatural e a percepção de quão maliciosas e corruptoras as forças das trevas estavam sobre o mundo.

Apesar de sua figura intimidadora, Ragnvaldr é surpreendentemente gentil, capaz de confortar e motivar os outros. Da mesma forma, ele é muito inteligente e sábio, apesar de ser frequentemente comparado a um bárbaro.">Ragnvaldr</a>

        <a data-name="Le'garde" 
   data-image="https://static.wikia.nocookie.net/fearandhunger/images/b/bd/Portrait.webp/revision/latest?cb=20240722140108"
   data-desc="O profetizado... Já em vida, muitas histórias foram escritas e cantadas sobre sua história. Não sabemos onde a profecia começou, mas nem preciso dizer que é tudo falácia. Mas o próprio homem... É um tipo curioso. Definitivamente há algo diferente nele e, qualquer que seja seu papel no esquema geral das coisas, no mínimo ele começou algo maior..." 
   data-historia="Le'garde é um guerreiro determinado que luta contra a opressão e busca unificar as terras fragmentadas. Capturado e preso nas Masmorras do Medo e da Fome, ele representa a esperança e a resistência contra os horrores que lá habitam. Sua presença na fortaleza não é apenas fruto de um infortúnio, mas parte de um plano maior que pode alterar todo o destino das terras." 
   data-status="Ataque: 35, Defesa: 25, Sorte: 20, Agilidade: 15"
   data-personalidade="Le'garde é um homem misterioso, definido por sua estatura sobrenatural e presença magnética, capaz de facilmente atrair outros para sua causa. Ele é um líder carismático, altamente habilidoso na arte da guerra e da política.

No início de sua carreira, Le'garde parecia ser um nobre cavaleiro, enojado com a corrupção de Rondon e que desejava trazer um futuro melhor para a humanidade. Mesmo em seus primeiros dias, Le'garde já podia ser considerado excessivamente ambicioso, idealista ou até mesmo ávido por poder, pois não se contentava com a ideia de ser um mero rei, acreditando que qualquer bem que pudesse trazer à humanidade com tal posição não duraria muito.

Apesar de afirmar não acreditar em profecias, Le'garde ainda se vê como alguém com um propósito maior e destinado à grandeza. Sua crença de que é especial de alguma forma indica que ele possivelmente é um narcisista ou, no mínimo, alguém com tendências egoístas.

O desejo de Le'garde por prosperidade eterna o levaria a um caminho mais sombrio. Com o tempo, ele se tornou mais agressivo e extremista em sua abordagem em relação aos seus objetivos, acreditando que, para ter sucesso, precisava se tornar um deus e unir o mundo sob seu domínio, custasse o que custasse. À medida que ganhava mais poder, Le'garde tornou-se mais recluso, arrogante e manipulador, vendo o crescimento de seu exército e influência política como uma confirmação de sua crença de que ele era o único destinado a salvar a humanidade.

Às vezes, pode não ficar claro se o desejo de Le'garde de ajudar a humanidade vem de uma genuína bondade ou se é apenas uma desculpa para justificar sua ganância por poder. Também é possível que, embora Le'garde queira genuinamente trazer a paz, ele queira ser o único a fazê-lo e não aceitaria que outra pessoa assumisse tal dever em seu lugar.

No entanto, apesar de todos os seus defeitos, Le'garde ainda é capaz de demonstrar gentileza com os outros. Se o jogador duvidar de D'arce e achar que ela não é confiável, Le'garde tentará convencê-lo do contrário, apesar de tal ação colocar seu disfarce de amnésico e todo o seu plano de se tornar um deus em risco. Isso pode indicar que, embora seus objetivos sejam sua principal prioridade, ele ainda se preocupa com seus subordinados.">Le'garde</a>

    </aside>

    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title">Título do Personagem</h2>
        <img id="modal-image" src="" alt="Imagem do personagem" />
        <p id="modal-text"></p>

        <div class="extra-boxes">
          <div class="box-historia">
            <h3>Descrição</h3>
            <p id="modal-historia"></p>
          </div>
          <div class="box-status">
            <h3>Status</h3>
            <ul id="modal-status">
              <li>Ataque: -</li>
              <li>Defesa: -</li>
              <li>Sorte: -</li>
              <li>Agilidade: -</li>
            </ul>
          </div>
          <div class="box-personalidade">
            <h3>Personalidade</h3>
            <p id="modal-personalidade"></p>
          </div>
        </div>
      </div>
    </div>

    <main></main>

    <div style="width: 100%; height: 0px; background: transparent"></div>

    <footer class="footer">
      <p>Fear Hunger Wiki</p>
    </footer>

    <script>
      const modal = document.getElementById("myModal");
      const modalTitle = document.getElementById("modal-title");
      const modalImage = document.getElementById("modal-image");
      const modalText = document.getElementById("modal-text");
      const modalHistoria = document.getElementById("modal-historia");
      const modalStatus = document.getElementById("modal-status");
      const modalPersonalidade = document.getElementById("modal-personalidade");
      const closeBtn = modal.querySelector(".close");
      const links = document.querySelectorAll(".barra-lateral a");

      links.forEach((link) => {
        link.addEventListener("click", () => {
          modalTitle.textContent = link.getAttribute("data-name");
          modalImage.src = link.getAttribute("data-image");
          modalImage.alt = link.getAttribute("data-name");
          modalText.textContent = link.getAttribute("data-desc");
          modalHistoria.textContent = link.getAttribute("data-historia");
          modalPersonalidade.textContent = link.getAttribute("data-personalidade");

          const statusString = link.getAttribute("data-status");
          const statusArray = statusString.split(",").map(s => s.trim());

          modalStatus.innerHTML = "";
          statusArray.forEach(stat => {
            const li = document.createElement("li");
            li.textContent = stat;
            modalStatus.appendChild(li);
          });

          modal.style.display = "block";
          modal.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });

      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });

      window.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });
    </script>
